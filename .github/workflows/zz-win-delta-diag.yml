name: zz-win-delta-diag
on:
  push:
    branches: [test/delta-context-windows-deterministic]
jobs:
  diag:
    name: stop-return-turn on windows (attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - name: Loop the stopped-return-turn test under load
        shell: bash
        run: |
          set +e
          # background load: the whole file once, like a busy shard
          pnpm exec vitest run server/zz-windiag.e2e.test.ts --reporter=dot > load.log 2>&1 &
          fails=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== iteration $i"
            pnpm exec vitest run server/zz-windiag.e2e.test.ts -t "person stops the return turn" --reporter=default 2>&1 | tee "iter-$i.log" | grep -E "WINDIAG|✓|×|Tests " 
            grep -q "WINDIAG failure" "iter-$i.log" && fails=$((fails+1))
          done
          wait
          echo "=== background load result"; tail -5 load.log; grep -c "WINDIAG failure" load.log
          echo "=== iterations failed: $fails"
          for i in 1 2 3 4 5 6 7 8; do if grep -q "WINDIAG failure" "iter-$i.log"; then echo "##### dump iteration $i"; sed -n '/WINDIAG failure/,/WINDIAG end/p' "iter-$i.log"; fi; done
          grep -q "WINDIAG failure" load.log && { echo "##### dumps from background load"; sed -n '/WINDIAG failure/,/WINDIAG end/p' load.log; }
          exit $fails
